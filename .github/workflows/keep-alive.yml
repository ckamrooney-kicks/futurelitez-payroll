name: Keep Supabase awake

on:
  schedule:
    - cron: "17 13 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$URL/auth/v1/health" -H "apikey: $KEY" > /dev/null
          echo "Supabase is awake"
